<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Страница не найдена</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #f5f7fa; color: #313131;
      font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 560px; text-align: center; animation: up .5s ease-out; }
    @keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .code {
      font-size: 6rem; font-weight: 600; line-height: 1; margin: 0; letter-spacing: -4px;
      background: linear-gradient(135deg, #0073c0, #005fa3);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .msg { font-size: 1.6rem; font-weight: 600; color: #444; margin: .25rem 0 .75rem; }
    .desc { font-size: 1rem; color: rgba(49,49,49,.75); line-height: 1.6; margin: 0 0 1.75rem; }
    .btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .7rem 1.5rem; border-radius: 8px; border: 1px solid transparent;
      font: inherit; font-weight: 500; cursor: pointer; text-decoration: none;
    }
    .btn-transp { background: transparent; border-color: #0073c0; color: #0073c0; }
    .btn-transp:hover { background: #0073c0; color: #fff; }
    .btn-solid { background: #0073c0; color: #fff; }
    .btn-solid:hover { background: #005fa3; }
    @media (max-width: 560px) { .code { font-size: 4.5rem; } .btns { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="code">404</h1>
    <p class="msg">Страница не найдена</p>
    <p class="desc">
      Возможно, она была удалена или вы перешли по неверной ссылке.<br>
      Проверьте адрес или вернитесь на главную.
    </p>
    <div class="btns">
      <button type="button" class="btn btn-transp" onclick="window.history.back()">Назад</button>
      <a href="/" class="btn btn-solid">На главную</a>
    </div>
  </div>
</body>
</html>
