<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Страница не найдена</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #f5f7fa; color: #313131;
      font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 560px; text-align: center; animation: up .5s ease-out; }
    @keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .code {
      font-size: 6rem; font-weight: 600; line-height: 1; margin: 0; letter-spacing: -4px;
      background: linear-gradient(135deg, #0073c0, #005fa3);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .msg { font-size: 1.6rem; font-weight: 600; color: #444; margin: .25rem 0 .75rem; }
    .desc { font-size: 1rem; color: rgba(49,49,49,.75); line-height: 1.6; margin: 0 0 1.75rem; }
    .btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .app-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      padding: 9px 32px; border: none; border-radius: 12px; overflow: hidden;
      font: inherit; font-size: 15px; font-weight: 500; line-height: 1.5715; white-space: nowrap;
      text-decoration: none; cursor: pointer; user-select: none; touch-action: manipulation;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .app-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.7s ease;
    }
    .app-btn:hover::before { left: 100%; }
    .app-btn:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      transform: translateY(-2px);
    }
    .app-btn:active { transform: translateY(0); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); }
    .app-btn:focus-visible { outline: 2px solid #0073c0; outline-offset: 2px; }
    .app-btn--secondary {
      background: #fff; color: #0073c0; border: 1px solid #c9dcf2;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .app-btn--secondary::before {
      background: linear-gradient(90deg, transparent, rgba(0, 115, 192, 0.08), transparent);
    }
    .app-btn--secondary:hover {
      background: #f2f8ff; border-color: #0073c0;
      box-shadow: 0 6px 16px rgba(0, 115, 192, 0.14);
    }
    @media (max-width: 560px) { .code { font-size: 4.5rem; } .btns { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- <h1 class="code">404</h1> -->
    <p class="msg">Страница не найдена</p>
    <p class="desc">
      Возможно, она была удалена или вы перешли по неверной ссылке.<br>
      Проверьте адрес или вернитесь на главную.
    </p>
    <div class="btns">
      <button type="button" class="app-btn app-btn--secondary" onclick="window.history.back()">Назад</button>
      <a href="/" class="app-btn">На главную</a>
    </div>
  </div>
</body>
</html>
